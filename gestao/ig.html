<body>
<p>Conectando o Instagram…</p>
<script>
// Volta do Login com Instagram: guarda o código e devolve para a gestão, que termina a conexão logada.
(function(){
  var q=new URLSearchParams(location.search);
  var r={code:(q.get('code')||'').replace(/#_$/,''),state:q.get('state')||'',error:q.get('error_description')||q.get('error')||''};
  try{sessionStorage.setItem('stond-ig-cb',JSON.stringify(r))}catch(e){}
  location.replace('/gestao/#metricas');
})();
</script>
